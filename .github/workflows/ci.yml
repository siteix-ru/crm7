name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lighthouse (mobile, Fast 3G)
        run: npm run lighthouse
      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/artifacts/lighthouse
          if-no-files-found: ignore

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl
      - name: Lint PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHP standalone tests
        run: |
          set -e
          for f in api/tests/*.php; do
            [ -e "$f" ] || continue
            echo "Running $f"
            php "$f"
          done

  python-deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl
      - name: Show versions
        run: |
          python --version
          php -v | head -1
      - name: Install test dependencies
        # deploy/tests импортируют deploy_crm7/release_crm7 (lock-path tests),
        # а эти модули требуют paramiko уже при импорте.
        run: python -m pip install --disable-pip-version-check -r deploy/requirements-test.txt
      - name: Compile Python sources and tests
        run: |
          python -m py_compile \
            deploy/backup_crm7.py \
            deploy/restore_crm7.py \
            deploy/update_lock.py \
            deploy/tests/test_backup.py \
            deploy/tests/test_restore.py
      - name: Deploy Python tests (backup/restore/permissions/exclusions)
        # Все тесты изолированы: temp-каталоги, mocks, FakeRunner; Docker/MariaDB не нужны.
        run: python -m unittest discover -s deploy/tests -p 'test_*.py' -v

  images:
    if: github.ref == 'refs/heads/master'
    needs: [frontend, php]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          docker build -f deploy/Dockerfile.app -t "ghcr.io/$OWNER/crm7-app:sha-$SHA" .
          docker build -f deploy/Dockerfile.web -t "ghcr.io/$OWNER/crm7-web:sha-$SHA" .
          docker push "ghcr.io/$OWNER/crm7-app:sha-$SHA"
          docker push "ghcr.io/$OWNER/crm7-web:sha-$SHA"

  e2e-mobile:
    needs: [frontend, php]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: crm_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure API
        run: |
          cp api/config/.env.example api/config/.env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' api/config/.env
          sed -i 's/^DB_NAME=.*/DB_NAME=crm_ci/' api/config/.env
          sed -i 's/^DB_USER=.*/DB_USER=root/' api/config/.env
          sed -i 's/^DB_PASS=.*/DB_PASS=root/' api/config/.env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(openssl rand -hex 32)/" api/config/.env
          sed -i "s/^DB_CONFIG_KEY=.*/DB_CONFIG_KEY=$(openssl rand -hex 32)/" api/config/.env
      - name: Migrate and seed
        run: |
          php api/bin/migrate.php --allow-destructive
          php api/bin/seed-dev.php --password=Secret123
          php api/bin/seed-demo.php --force --allow-non-demo --password=Secret123
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Mobile e2e
        env:
          CRM_BASE_URL: http://localhost:4173
          CRM_API_URL: http://127.0.0.1:8080/api/v2
          CRM_BROWSER_CHANNEL: bundled
          CRM_E2E_MOBILE: '1'
          CRM_PASSWORD: Secret123
        run: |
          php -S 127.0.0.1:8080 -t api/public api/public/router.php > /tmp/api.log 2>&1 &
          (cd frontend && npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/v2/health > /dev/null 2>&1 \
              && curl -fsS http://localhost:4173 > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          set +e
          (cd frontend && node tools/e2e/run.mjs)
          status=$?
          set -e
          tail -n 20 /tmp/api.log || true
          tail -n 20 /tmp/preview.log || true
          exit "$status"
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-artifacts
          path: frontend/artifacts/e2e
          if-no-files-found: ignore

  e2e-desktop-smoke:
    needs: [frontend, php]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: crm_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure API
        run: |
          cp api/config/.env.example api/config/.env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' api/config/.env
          sed -i 's/^DB_NAME=.*/DB_NAME=crm_ci/' api/config/.env
          sed -i 's/^DB_USER=.*/DB_USER=root/' api/config/.env
          sed -i 's/^DB_PASS=.*/DB_PASS=root/' api/config/.env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(openssl rand -hex 32)/" api/config/.env
          sed -i "s/^DB_CONFIG_KEY=.*/DB_CONFIG_KEY=$(openssl rand -hex 32)/" api/config/.env
      - name: Migrate and seed
        run: |
          php api/bin/migrate.php --allow-destructive
          php api/bin/seed-dev.php --password=Secret123
          php api/bin/seed-demo.php --force --allow-non-demo --password=Secret123
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Desktop smoke e2e
        env:
          CRM_BASE_URL: http://localhost:4173
          CRM_API_URL: http://127.0.0.1:8080/api/v2
          CRM_BROWSER_CHANNEL: bundled
          CRM_E2E_SMOKE: '1'
          CRM_PASSWORD: Secret123
        run: |
          php -S 127.0.0.1:8080 -t api/public api/public/router.php > /tmp/api-smoke.log 2>&1 &
          (cd frontend && npx vite preview --port 4173 --strictPort > /tmp/preview-smoke.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/v2/health > /dev/null 2>&1 \
              && curl -fsS http://localhost:4173 > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          set +e
          (cd frontend && node tools/e2e/run.mjs)
          status=$?
          set -e
          tail -n 20 /tmp/api-smoke.log || true
          tail -n 20 /tmp/preview-smoke.log || true
          exit "$status"
      - name: Upload desktop smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-smoke-artifacts
          path: frontend/artifacts/e2e
          if-no-files-found: ignore

  # Отдельный изолированный стенд: DEMO_MODE=true и собственный MariaDB.
  # Обычные smoke/mobile job'ы работают с DEMO_MODE=false и не покрывают
  # demo:true сценарии — этот job проверяет именно их реальное выполнение.
  e2e-demo-guard:
    needs: [frontend, php]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: crm_ci_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure API (DEMO_MODE=true)
        run: |
          cp api/config/.env.example api/config/.env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' api/config/.env
          sed -i 's/^DB_NAME=.*/DB_NAME=crm_ci_demo/' api/config/.env
          sed -i 's/^DB_USER=.*/DB_USER=root/' api/config/.env
          sed -i 's/^DB_PASS=.*/DB_PASS=root/' api/config/.env
          sed -i 's/^DEMO_MODE=.*/DEMO_MODE=true/' api/config/.env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(openssl rand -hex 32)/" api/config/.env
          sed -i "s/^DB_CONFIG_KEY=.*/DB_CONFIG_KEY=$(openssl rand -hex 32)/" api/config/.env
          grep -q '^DEMO_MODE=true$' api/config/.env
      - name: Migrate and seed
        run: |
          php api/bin/migrate.php --allow-destructive
          php api/bin/seed-dev.php --password=Secret123
          php api/bin/seed-demo.php --force --password=Secret123
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Verify required demo:true scenarios exist
        run: |
          for name in \
            'demo guard: инфраструктурные мутации запрещены при DEMO_MODE=true' \
            'demo guard: чтение бизнес-маршрутов доступно в демо' \
            'demo guard: создание тестового черновика доступно в демо'; do
            grep -Fq "name: '$name'" frontend/tools/e2e/run.mjs \
              || { echo "missing required scenario: $name" >&2; exit 1; }
          done
      - name: Demo Guard e2e (DEMO_MODE=true)
        env:
          CRM_BASE_URL: http://localhost:4173
          CRM_API_URL: http://127.0.0.1:8080/api/v2
          CRM_BROWSER_CHANNEL: bundled
          CRM_E2E_SMOKE: '1'
          CRM_E2E_ONLY: 'demo guard:'
          CRM_PASSWORD: Secret123
        run: |
          php -S 127.0.0.1:8080 -t api/public api/public/router.php > /tmp/api-demo.log 2>&1 &
          (cd frontend && npx vite preview --port 4173 --strictPort > /tmp/preview-demo.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/v2/health > /dev/null 2>&1 \
              && curl -fsS http://localhost:4173 > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/api/v2/settings/public \
            | grep -Eq '"demo_mode"[[:space:]]*:[[:space:]]*true'; then
            echo 'backend is not running with DEMO_MODE=true' >&2
            tail -n 30 /tmp/api-demo.log || true
            exit 1
          fi
          set +e
          (cd frontend && node tools/e2e/run.mjs) 2>&1 | tee /tmp/demo-guard-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          for name in \
            'demo guard: инфраструктурные мутации запрещены при DEMO_MODE=true' \
            'demo guard: чтение бизнес-маршрутов доступно в демо' \
            'demo guard: создание тестового черновика доступно в демо'; do
            grep -Fq "✓ $name" /tmp/demo-guard-e2e.log \
              || { echo "required scenario did not pass: $name" >&2; status=1; }
          done
          guard_passed=$(grep -c '✓ demo guard:' /tmp/demo-guard-e2e.log || true)
          if [ "$guard_passed" -ne 3 ]; then
            echo "expected exactly 3 passed demo guard scenarios, got $guard_passed" >&2
            status=1
          fi
          tail -n 20 /tmp/api-demo.log || true
          tail -n 20 /tmp/preview-demo.log || true
          exit "$status"
      - name: Upload demo guard e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-guard-artifacts
          path: frontend/artifacts/e2e
          if-no-files-found: ignore
