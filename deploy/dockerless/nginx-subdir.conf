# CRM7 — Dockerless VPS, Nginx, installation in /demo/.
#
# This is a SEPARATE deployment instance with its own backend:
#   frontend: /srv/crm7/public/demo/     (frontend/dist copied here)
#   backend:  /srv/crm7/demo/api/        (copy of api/)
#   env:      /srv/crm7/demo/api/config/.env with API_BASE_PATH=/demo/api/v2
#
# One backend instance serves exactly one API_BASE_PATH. Do NOT use this
# profile together with nginx-root.conf to serve both URL spaces from one
# backend. Keep two independent instances if both /api/v2 and /demo/api/v2
# are required.
#
# REQUEST_URI is preserved by the stock fastcgi_params include; do not add a
# second fastcgi_param REQUEST_URI. Do not normalize REQUEST_URI in nginx.

server {
    listen 80;
    server_name crm.example.com;

    root /srv/crm7/public;
    index index.html;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny prefixes for the demo instance backend. More specific than ^~ /demo/api/.
    location ^~ /demo/api/config  { deny all; }
    location ^~ /demo/api/db      { deny all; }
    location ^~ /demo/api/src     { deny all; }
    location ^~ /demo/api/bin     { deny all; }
    location ^~ /demo/api/tests   { deny all; }
    location ^~ /demo/api/storage { deny all; }
    location ^~ /demo/api/var     { deny all; }

    location ^~ /demo/api/ {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /srv/crm7/demo/api/public/index.php;
        fastcgi_param SCRIPT_NAME     /demo/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /srv/crm7/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Nginx passes ALL client headers to FastCGI by default: clear the
        # spoofable proxy headers explicitly. See nginx-root.conf for details.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_REAL_IP       "";
        fastcgi_read_timeout 120s;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # The root-level /api/ front controller is intentionally absent: this
    # instance owns only the /demo/ URL space. Deny rules below are kept so
    # a stray root-level /api/... URL cannot reach a backend or disclose files.
    location ^~ /api/config  { deny all; }
    location ^~ /api/db      { deny all; }
    location ^~ /api/src     { deny all; }
    location ^~ /api/bin     { deny all; }
    location ^~ /api/tests   { deny all; }
    location ^~ /api/storage { deny all; }
    location ^~ /api/var     { deny all; }
    location ^~ /api/        { return 404; }

    location ^~ /var/     { deny all; }
    location ^~ /backups/ { deny all; }

    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }

    location = /demo/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /demo/config.js          { add_header Cache-Control "no-cache"; }
    location = /demo/manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /demo/sw.js              { add_header Cache-Control "no-cache"; }
    location /demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    # Optional landing page at the domain root; no CRM backend here.
    location = /index.html { try_files $uri =404; }
    location = /config.js  { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
