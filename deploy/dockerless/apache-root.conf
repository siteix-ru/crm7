# =============================================================================
# VERIFIED IN DISPOSABLE SMOKE (Apache 2.4.71 + PHP-FPM 8.2.36)
# =============================================================================
# CRM7 — Dockerless VPS, Apache 2.4 + PHP-FPM, root installation.
#
# Runtime smoke (Stage 3.4.163) confirmed on the disposable stack:
#   * GET /api/v2/health -> JSON with data.status = "ok";
#   * after the internal rewrite REQUEST_URI = /api/v2/health;
#   * SCRIPT_FILENAME = /srv/crm7/api/public/index.php;
#   * the <Files "index.php"> handler is applied to the rewritten request;
#   * /api/router.php is denied and never executed;
#   * service prefixes, dotfiles and .php sources in the docroot are denied;
#   * AllowOverride None does not break API routing.
#
# This is still not a claim of production readiness on any target host:
# validate with the target distribution's Apache/PHP-FPM build before use.
#
# Required Apache modules: mod_alias, mod_rewrite, mod_proxy, mod_proxy_fcgi,
# mod_authz_core, mod_unixd, mod_dir, mod_mime, mod_log_config, mod_headers,
# mod_setenvif (needed to forward the Authorization header to PHP-FPM).
# Replace server name and PHP-FPM socket with real values.
# NOTE: the surrounding httpd.conf must load the modules above; a vhost
# snippet alone is not sufficient.

<VirtualHost *:80>
    ServerName crm.example.com
    DocumentRoot /srv/crm7/public

    <Directory /srv/crm7/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        # Frontend uses hash routing: no server-side rewrite is needed.
        RewriteEngine Off

        # Without mod_php, a .php file here would be served as plain text.
        # Deny dotfiles and any PHP source in the document root explicitly.
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Backend parent is closed by default; only api/public is opened below.
    <Directory /srv/crm7/api>
        Require all denied
    </Directory>

    <DirectoryMatch "^/srv/crm7/api/(config|db|src|bin|tests|storage|var)(/|$)">
        Require all denied
    </DirectoryMatch>

    # CRM7 trusts X-Forwarded-For / X-Real-IP for throttling and audit, and
    # mod_proxy_fcgi forwards all client headers by default. Drop spoofable
    # proxy headers at vhost level. Behind a trusted reverse proxy, validate
    # the proxy boundary before removing these lines.
    <IfModule mod_headers.c>
        RequestHeader unset X-Forwarded-For
        RequestHeader unset X-Real-IP
        RequestHeader unset X-Forwarded-Host
    </IfModule>

    Alias /api/ "/srv/crm7/api/public/"
    <Directory /srv/crm7/api/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        # mod_proxy_fcgi does not pass the Authorization header to PHP by
        # default; without this, every Bearer-authenticated API call fails.
        <IfModule mod_setenvif.c>
            SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
        </IfModule>

        # CRM7 trusts X-Forwarded-For / X-Real-IP for throttling and audit.
        # mod_proxy_fcgi forwards arbitrary client headers by default, so drop
        # them here to prevent header spoofing. Behind a trusted reverse proxy
        # that rewrites them, validate the proxy boundary before removing this.
        # Never serve dotfiles or any PHP file other than index.php.
        RewriteRule (^|/)\. - [F,L]
        RewriteRule ^(?!index\.php$).*\.php$ - [F,L]
        # Front controller: every API URL is rewritten to index.php.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]

        <Files "index.php">
            Require all granted
            SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
        </Files>
    </Directory>
</VirtualHost>
