# CRM7 Dockerless VPS — log rotation for cron output.
# Install as /etc/logrotate.d/crm7-cron and validate with:
#   logrotate -d /etc/logrotate.d/crm7-cron       (dry run)
#   logrotate -v -f /etc/logrotate.d/crm7-cron    (forced test on disposable host)
#
# cron.sh opens the log with >> on every invocation, so no long-lived PHP-FPM
# process keeps it open. copytruncate avoids renaming a file that a running
# cron might still hold; a few bytes written exactly during rotation can be
# lost, which is acceptable for an informational cron log. Do NOT use this
# pattern for the application's structured logs if exactly-once retention is
# required.
/srv/crm7/var/log/cron.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su crm crm
    create 0600 crm crm
}
