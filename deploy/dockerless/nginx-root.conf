# CRM7 — Dockerless VPS, Nginx, root installation.
#
# Primary profile. Copy into /etc/nginx/conf.d/ (or include from a server block)
# and replace `crm.example.com` / PHP-FPM socket with real values.
#
# Invariants (see ../README.md):
#   document root: only /srv/crm7/public
#   API front controller: /srv/crm7/api/public/index.php
#   API_BASE_PATH=/api/v2 in /srv/crm7/api/config/.env
#   REQUEST_URI is preserved by the stock `fastcgi_params` include below.
#   DO NOT add a second `fastcgi_param REQUEST_URI` line here.
#   Paths containing `..` or `%2e%2e` are normalized by nginx before location
#   matching; explicit smoke assertions for them belong to Stage 3.4.163.

server {
    listen 80;
    server_name crm.example.com;

    root /srv/crm7/public;
    index index.html;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny service API prefixes. These prefix locations are more specific than
    # "^~ /api/" below, so they win regardless of declaration order.
    location ^~ /api/config  { deny all; }
    location ^~ /api/db      { deny all; }
    location ^~ /api/src     { deny all; }
    location ^~ /api/bin     { deny all; }
    location ^~ /api/tests   { deny all; }
    location ^~ /api/storage { deny all; }
    location ^~ /api/var     { deny all; }

    # These live outside the document root and must never be served.
    location ^~ /var/     { deny all; }
    location ^~ /backups/ { deny all; }

    # Single API front controller. ^~ stops regex locations from taking over.
    # fastcgi_params already defines: fastcgi_param REQUEST_URI $request_uri;
    location ^~ /api/ {
        include fastcgi_params;

        # No duplicate REQUEST_URI parameter: it comes from fastcgi_params.
        fastcgi_param SCRIPT_FILENAME /srv/crm7/api/public/index.php;
        fastcgi_param SCRIPT_NAME     /api/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /srv/crm7/public;
        fastcgi_param HTTP_AUTHORIZATION   $http_authorization;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP       $http_x_real_ip;
        fastcgi_read_timeout 120s;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Dotfiles are never served from the public document root.
    location ~ /\. { deny all; }

    # No direct PHP execution anywhere in the frontend document root.
    # Under /api/ this regex is skipped by ^~ above; all /api/* URLs are routed
    # to the single fixed SCRIPT_FILENAME, so arbitrary .php files cannot run.
    location ~ \.php$ { return 404; }

    # Frontend static files. hash routing needs no server-side rewrites;
    # the fallback only returns index.html for unknown non-API paths.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /config.js          { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /sw.js              { add_header Cache-Control "no-cache"; }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
